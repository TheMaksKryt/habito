# CI-гейты (Принцип VII конституции): каждый PR и push в main проходит
# `bun run check` (та же команда, что локально: generate → lint → typecheck →
# test) с воспроизводимой установкой (--frozen-lockfile).
# Отдельный job собирает оба Docker-образа без push — Dockerfile'ы проверяются
# на каждом изменении и не гниют. Слияние в main блокируется branch protection
# по обоим jobs (настройка — README, секция мейнтейнера).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Новый push в ту же ветку/PR отменяет незавершённый прогон — агентские
# сессии пушат часто, очередь из устаревших прогонов бесполезна
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Check (same command as local `bun run check`)
        run: bun run check

      # Отчёт, не гейт: порог покрытия появится вместе с домен-логикой.
      # Таблица — в Summary этого job (scripts/coverage-summary.ts).
      - name: Coverage report (informational, no threshold)
        continue-on-error: true
        run: |
          bun run --filter '*' test:coverage
          bun scripts/coverage-summary.ts >> "$GITHUB_STEP_SUMMARY"

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.app }} image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=habito-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=habito-${{ matrix.app }}

  # Фильтр путей для условного e2e: на pull_request paths-filter читает список
  # файлов через API (checkout не нужен); на push фильтр требует git-истории,
  # поэтому e2e только для PR. Job e2e НЕ в required checks — на PR без UI он
  # skipped, а обязательная проверка зависла бы в «Expected».
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ui:
              - 'apps/web/app/**'
              - 'apps/web/nuxt.config.ts'
              - 'apps/web/e2e/**'
              - 'apps/web/playwright.config.ts'
              - 'apps/web/Dockerfile'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yaml'

  # Реальная цепочка браузер → SSR (nitro-bun) → SDK → API на полном стеке
  e2e:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Start stack (compose, wait for healthchecks)
        run: docker compose up --build --wait --wait-timeout 300

      - name: Playwright
        run: bun run --filter web test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: Stack logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail=200

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop stack
        if: always()
        run: docker compose down -v
